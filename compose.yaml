name: logistic

services:
  postgres:
    image: postgres:18-alpine
    container_name: logistic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistic}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistic_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - logistic_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-logistic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistic-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-logistic};Username=${POSTGRES_USER:-appuser};Password=${POSTGRES_PASSWORD:-logistic_dev}
      Cors__Origins__0: http://localhost:5173
    ports:
      - "5111:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ${LOGISTIC_WEB_PATH:-../logistic-web}
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5111
    container_name: logistic-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  logistic_postgres_data: