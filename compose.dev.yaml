name: logistic-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: logistic-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistic}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistic_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - logistic_postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-logistic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: logistic-api-dev
    working_dir: /src
    volumes:
      - .:/src
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-logistic};Username=${POSTGRES_USER:-appuser};Password=${POSTGRES_PASSWORD:-logistic_dev}
      Cors__Origins__0: http://localhost:5173
    command: >
      dotnet watch run
      --project Logistic.Api/Logistic.Api.csproj
      --no-launch-profile
      --urls http://0.0.0.0:8080
    ports:
      - "5111:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24-alpine
    container_name: logistic-web-dev
    working_dir: /app
    volumes:
      - ${LOGISTIC_WEB_PATH:-../logistic-web}:/app
      - logistic_web_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:5111
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  logistic_postgres_dev_data:
  logistic_web_node_modules: